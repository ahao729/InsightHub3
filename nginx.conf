# InsightHub — nginx production configuration
# Serves frontend static files and proxies /api/ to backend

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Gzip ────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Security headers ────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Frontend static files ───────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # ── Redirect broken MPA paths ────────────────────────────────
        # 用户可能从外部链接进入 /posts/xxx.html 等不存在的路径，此时 try_files
        # 会错误地兜底为 index.html，导致浏览器 URL 停留在错误路径，JS/CSS 相对
        # 路径全部偏移（变成 /posts/assets/...），页面交互失效。
        # 此处将此类路径 301 重定向到根目录下的同名文件。
        rewrite ^/posts/(\w+\.html)$ /$1 permanent;

        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── API proxy ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Rate limit headers
        add_header X-RateLimit-Limit $upstream_http_x_ratelimit_limit always;
        add_header X-RateLimit-Remaining $upstream_http_x_ratelimit_remaining always;
        add_header Retry-After $upstream_http_retry_after always;
    }

    # ── Deny access to dotfiles ─────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
