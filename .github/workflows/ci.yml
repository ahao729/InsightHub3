name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: insighthub
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: insighthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://insighthub:test_password@localhost:5432/insighthub_test
      JWT_SECRET: ci-test-secret-key-that-is-long-enough-for-validation
      NODE_ENV: test
      ADMIN_DEFAULT_PASSWORD: test_admin_pass_123
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          CI: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint (if configured)
        run: npm run lint --if-present || true
      - name: Build
        run: npm run build
      - name: Check build output exists
        run: test -d dist

  mcp-smoke:
    name: MCP Server Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install MCP dependencies
        working-directory: mcp-server
        run: npm ci || npm install
      - name: Verify MCP server starts
        working-directory: mcp-server
        run: timeout 5 node index.js --help 2>/dev/null || node -e "import('./index.js').then(() => console.log('MCP module loads OK')).catch(e => { console.error(e.message); process.exit(1); })"
