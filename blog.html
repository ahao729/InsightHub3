<style>
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 32px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary)}
.logo{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--color-brand)}
.breadcrumb{font-size:12px;color:var(--color-text-secondary)}

/* Hero */
.blog-hero{padding:40px 32px 24px;border-bottom:0.5px solid var(--color-border-tertiary);text-align:center}
.blog-hero h1{font-size:24px;font-weight:500;margin-bottom:8px}
.blog-hero p{font-size:13px;color:var(--color-text-secondary);max-width:520px;margin:0 auto;line-height:1.7}

/* Category filter */
.cat-bar{display:flex;gap:8px;padding:16px 32px;border-bottom:0.5px solid var(--color-border-tertiary);flex-wrap:wrap;overflow-x:auto}
.cat-chip{font-size:12px;padding:6px 14px;border-radius:999px;border:0.5px solid var(--color-border-secondary);cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary);font-family:var(--font-sans);white-space:nowrap;transition:all var(--transition-fast)}
.cat-chip.active{background:var(--color-brand);color:#fff;border-color:var(--color-brand)}
.cat-chip:hover:not(.active){border-color:var(--color-border-primary)}

/* Blog grid */
.blog-wrap{padding:28px 32px}
.blog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.blog-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary);cursor:pointer;transition:border-color var(--transition-fast), box-shadow var(--transition-fast);display:flex;flex-direction:column}
.blog-card:hover{border-color:var(--color-border-primary);box-shadow:var(--shadow-card-hover)}
.blog-card-img{width:100%;aspect-ratio:16/9;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--color-text-tertiary);overflow:hidden}
.blog-card-img img{width:100%;height:100%;object-fit:cover}
.blog-card-body{padding:18px;flex:1;display:flex;flex-direction:column}
.blog-card-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.blog-card-cat{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--color-background-secondary);color:var(--color-text-secondary);font-weight:500}
.blog-card-cat.product{background:var(--color-brand-light);color:var(--color-text-success)}
.blog-card-cat.insight{background:#E6F1FB;color:#185FA5}
.blog-card-cat.tutorial{background:#EEEDFE;color:#534AB7}
.blog-card-cat.case{background:#FAECE7;color:#993C1D}
.blog-card-date{font-size:11px;color:var(--color-text-tertiary)}
.blog-card-title{font-size:15px;font-weight:500;line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.blog-card-excerpt{font-size:12px;color:var(--color-text-secondary);line-height:1.6;flex:1;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;margin-bottom:12px}
.blog-card-foot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:0.5px solid var(--color-border-tertiary);margin-top:auto}
.blog-card-read{font-size:12px;color:var(--color-brand);display:flex;align-items:center;gap:4px}
.blog-card-read i{font-size:13px}
.blog-card-author{font-size:11px;color:var(--color-text-tertiary);display:flex;align-items:center;gap:4px}

/* Pagination */
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;padding:32px 0 40px}
.page-btn{min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:12px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary);font-family:var(--font-sans);transition:all var(--transition-fast)}
.page-btn:hover{border-color:var(--color-border-primary);color:var(--color-text-primary)}
.page-btn.active{background:var(--color-brand);color:#fff;border-color:var(--color-brand)}
.page-btn.next{font-weight:500}

/* Subscribe CTA */
.blog-subscribe{margin:0 32px 32px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:28px;text-align:center;background:var(--color-background-secondary)}
.blog-subscribe h3{font-size:15px;font-weight:500;margin-bottom:6px}
.blog-subscribe p{font-size:12px;color:var(--color-text-secondary);margin-bottom:14px}
.sub-form{display:flex;gap:8px;max-width:400px;margin:0 auto}
.sub-form input{flex:1;font-size:13px;padding:9px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans)}
.sub-form input:focus{outline:none;border-color:var(--color-brand)}

/* Footer */
.footer-inner{padding:24px 32px;border-top:0.5px solid var(--color-border-tertiary);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.footer-left{font-size:13px;color:var(--color-text-secondary)}
.footer-links{display:flex;gap:20px;font-size:12px;color:var(--color-text-secondary)}
.footer-links span{cursor:pointer}
.footer-links span:hover{color:var(--color-text-primary)}

/* Mobile drawer */
.mobile-drawer{display:none;position:fixed;top:0;right:-280px;width:280px;max-width:80vw;height:100vh;background:var(--color-background-primary);border-left:0.5px solid var(--color-border-tertiary);z-index:1050;flex-direction:column;padding:20px 8px 8px;transition:right .3s;box-shadow:0 4px 24px rgba(0,0,0,0.12);overflow-y:auto}
.mobile-drawer.open{right:0}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:4px 12px 16px;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:8px}
.drawer-logo{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.drawer-close{width:28px;height:28px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);border-radius:var(--border-radius-sm)}
.drawer-close:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.drawer-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--border-radius-md);font-size:13px;color:var(--color-text-primary);text-decoration:none;transition:background var(--transition-fast)}
.drawer-link:hover{background:var(--color-background-secondary)}
.drawer-link i{font-size:16px;color:var(--color-text-secondary);width:20px;text-align:center}
.drawer-link.active{background:var(--color-brand-light);color:var(--color-brand)}
.drawer-link.active i{color:var(--color-brand)}
.drawer-divider{height:0.5px;background:var(--color-border-tertiary);margin:8px 12px}
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:1040}
.drawer-backdrop.active{display:block}

/* Responsive */
@media(max-width:768px){.blog-grid{grid-template-columns:1fr}.blog-wrap{padding:20px 16px}.cat-bar{padding:12px 16px}.blog-hero{padding:28px 16px 20px}.blog-subscribe{margin:0 16px 24px}.sub-form{flex-direction:column}.hamburger{display:flex}.hamburger span{display:block}}
@media(min-width:769px){.hamburger{display:none}}
@media(min-width:769px) and (max-width:1024px){.blog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Empty state */
.empty-state{text-align:center;padding:60px 0;color:var(--color-text-secondary);font-size:13px;display:none}
.empty-state i{font-size:40px;margin-bottom:16px;color:var(--color-text-tertiary)}

var ITEMS_PER_PAGE = 6;
var currentCat = 'all';
var currentPage = 1;

function filterByCat(cat) {
  currentCat = cat;
  currentPage = 1;
  // Update chip styles
  document.querySelectorAll('.cat-chip').forEach(function(el) {
    el.classList.toggle('active', el.dataset.cat === cat);
  });
  render();
}

function render() {
  var filtered = currentCat === 'all'
    ? articles
    : articles.filter(function(a) { return a.cat === currentCat; });

  var totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;

  var start = (currentPage - 1) * ITEMS_PER_PAGE;
  var pageItems = filtered.slice(start, start + ITEMS_PER_PAGE);

  var grid = document.getElementById('blog-grid');
  var empty = document.getElementById('empty-state');
  var pagination = document.getElementById('pagination');

  if (pageItems.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    pagination.innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = pageItems.map(function(a) {
    var catClassMap = { product: 'product', insight: 'insight', tutorial: 'tutorial', case: 'case' };
    return '<div class="blog-card" onclick="location.href=\'posts/' + a.id + '.html\'">'
      + '<div class="blog-card-img"><img src="posts/images/' + a.id + '.svg" alt="' + a.title + '" loading="lazy"></div>'
      + '<div class="blog-card-body">'
      + '<div class="blog-card-meta">'
      + '<span class="blog-card-cat ' + (catClassMap[a.cat] || '') + '">' + a.catLabel + '</span>'
      + '<span class="blog-card-date">' + a.date + '</span>'
      + '</div>'
      + '<div class="blog-card-title">' + a.title + '</div>'
      + '<div class="blog-card-excerpt">' + a.excerpt + '</div>'
      + '<div class="blog-card-foot">'
      + '<span class="blog-card-author"><i class="ti ti-user"></i>' + a.author + '</span>'
      + '<span class="blog-card-read">阅读全文 <i class="ti ti-arrow-right"></i></span>'
      + '</div>'
      + '</div>'
      + '</div>';
  }).join('');

  // Pagination
  if (totalPages <= 1) {
    pagination.innerHTML = '';
    return;
  }
  var html = '<button class="page-btn" onclick="goPage(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled style="opacity:0.3;cursor:default"' : '') + '><i class="ti ti-chevron-left"></i></button>';
  for (var i = 1; i <= totalPages; i++) {
    html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
  }
  html += '<button class="page-btn next" onclick="goPage(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled style="opacity:0.3;cursor:default"' : '') + '><i class="ti ti-chevron-right"></i></button>';
  pagination.innerHTML = html;
}

function goPage(p) {
  if (p < 1) return;
  currentPage = p;
  render();
  document.getElementById('blog-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Category click handler
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.cat-chip').forEach(function(el) {
    el.addEventListener('click', function() {
      filterByCat(this.dataset.cat);
    });
  });
  render();
});

// Mobile drawer
(function() {
  var btn = document.getElementById('hamburger-btn');
  var drawer = document.getElementById('mobile-drawer');
  var backdrop = document.getElementById('drawer-backdrop');
  var closeBtn = document.getElementById('drawer-close');
  function openDrawer() {
    drawer.classList.add('open');
    backdrop.classList.add('active');
    btn.setAttribute('aria-expanded', 'true');
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    backdrop.classList.remove('active');
    btn.setAttribute('aria-expanded', 'false');
  }
  if (btn) btn.addEventListener('click', openDrawer);
  if (backdrop) backdrop.addEventListener('click', closeDrawer);
  if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
  document.querySelectorAll('.drawer-link').forEach(function(link) {
    link.addEventListener('click', closeDrawer);
  });
})();
