<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据产品市场 · InsightHub Data 原型</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="assets/stub-runtime.js"></script>
</head>
<body>
<div class="proto-shell">
<style>
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 32px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary)}
.logo{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--color-brand)}
.breadcrumb{font-size:12px;color:var(--color-text-secondary)}
.hero{padding:32px 32px 24px;border-bottom:0.5px solid var(--color-border-tertiary)}
.hero h1{font-size:22px;font-weight:500;margin-bottom:8px}
.hero p{font-size:13px;color:var(--color-text-secondary);line-height:1.7;max-width:560px;margin-bottom:20px}
.search-row{display:flex;gap:8px;max-width:480px}
.search-input{flex:1;font-size:13px;padding:8px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary)}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:0.5px solid var(--color-border-tertiary);flex-wrap:wrap;gap:10px}
.filter-group{display:flex;gap:6px;flex-wrap:wrap}
.filter-chip{font-size:12px;padding:5px 12px;border-radius:999px;border:0.5px solid var(--color-border-secondary);cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary)}
.filter-chip.active{background:var(--color-brand);color:#fff;border-color:var(--color-brand)}
.filter-chip:hover:not(.active){border-color:var(--color-border-primary)}
.result-count{font-size:12px;color:var(--color-text-secondary)}
.sort-select{font-size:12px;padding:5px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary)}
.grid-wrap{padding:24px 32px}
.pkg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pkg-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:18px;background:var(--color-background-primary);cursor:pointer;display:flex;flex-direction:column}
.pkg-card:hover{border-color:var(--color-border-primary)}
.pkg-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.pkg-icon{width:38px;height:38px;border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;font-size:18px}
.pkg-tag{font-size:11px;padding:2px 8px;border-radius:999px}
.tag-live{background:var(--color-brand-light);color:var(--color-text-success)}
.tag-soon{background:#F1EFE8;color:#5F5E5A}
.tag-hot{background:#FAEEDA;color:#854F0B}
.pkg-name{font-size:14px;font-weight:500;margin-bottom:6px}
.pkg-desc{font-size:12px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:14px;flex:1}
.pkg-foot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:0.5px solid var(--color-border-tertiary)}
.pkg-foot-meta{display:flex;gap:10px;font-size:11px;color:var(--color-text-secondary)}
.pkg-foot-meta span{display:flex;align-items:center;gap:3px}
.pkg-price{font-size:13px;font-weight:500}
.pkg-price-from{font-size:10px;color:var(--color-text-secondary);font-weight:400}
.cat-pills{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.cat-pill{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--color-background-secondary);color:var(--color-text-secondary)}
.ic-green{background:var(--color-brand-light);color:var(--color-brand-dark)}
.ic-blue{background:#E6F1FB;color:#185FA5}
.ic-amber{background:#FAEEDA;color:#854F0B}
.ic-purple{background:#EEEDFE;color:#534AB7}
.ic-coral{background:#FAECE7;color:#993C1D}
.ic-teal{background:var(--color-brand-light);color:var(--color-text-success)}
.ic-gray{background:#F1EFE8;color:#5F5E5A}
.ic-pink{background:#FBEAF0;color:#993556}
.empty-state{text-align:center;padding:60px 0;color:var(--color-text-secondary);font-size:13px}
</style>

<div class="nav">
  <div class="logo" onclick="location.href='index.html'"><div class="logo-dot"></div>InsightHub Data</div>
  <div class="breadcrumb">数据产品市场</div>
</div>

<div class="hero">
  <h1>数据产品市场</h1>
  <p>每个数据包包含 API、看板、AI 报告生成与 MCP 工具，按需订阅，逐步上架。</p>
  <div class="search-row">
    <input class="search-input" id="search-input" type="text" placeholder="搜索数据包，如「企业」「行业趋势」「专利」..." oninput="applyFilters()" />
  </div>
</div>

<div class="toolbar">
  <div class="filter-group" id="status-filters">
    <span class="filter-chip active" data-status="all">全部</span>
    <span class="filter-chip" data-status="live">已上线</span>
    <span class="filter-chip" data-status="soon">规划中</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="result-count" id="result-count">8 个数据包</span>
    <select class="sort-select" id="sort-select" onchange="applyFilters()">
      <option value="default">推荐排序</option>
      <option value="price-asc">价格从低到高</option>
      <option value="name">名称排序</option>
    </select>
  </div>
</div>

<div class="toolbar" style="border-top:none">
  <div class="filter-group" id="cat-filters">
    <span class="filter-chip active" data-cat="all">所有分类</span>
    <span class="filter-chip" data-cat="商业情报">商业情报</span>
    <span class="filter-chip" data-cat="内容与搜索">内容与搜索</span>
    <span class="filter-chip" data-cat="企业风控">企业风控</span>
    <span class="filter-chip" data-cat="金融">金融</span>
    <span class="filter-chip" data-cat="Web3">Web3</span>
    <span class="filter-chip" data-cat="政策">政策</span>
    <span class="filter-chip" data-cat="科研">科研</span>
    <span class="filter-chip" data-cat="教育">教育</span>
  </div>
</div>

<div class="grid-wrap">
  <div class="pkg-grid" id="pkg-grid"></div>
  <div class="empty-state" id="empty-state" style="display:none">没有找到匹配的数据包，试试调整筛选条件</div>
</div>

<script>
var packages=[
  {name:'创业商业情报',icon:'ti-rocket',color:'ic-green',status:'live',statusLabel:'已上线',cat:'商业情报',desc:'行业趋势、竞品分析、项目评估、MVP 建议、AI 创业报告',apis:6,update:'每日',price:99,link:'package-startup-intel.html'},
  {name:'AI / GEO 分析',icon:'ti-brand-google',color:'ic-blue',status:'live',statusLabel:'已上线',cat:'内容与搜索',desc:'网站 AI 可见度评分、品牌内容覆盖、GEO 优化建议',apis:6,update:'每日',price:99,link:'package-ai-geo.html'},
  {name:'企业情报与风控',icon:'ti-building',color:'ic-amber',status:'live',statusLabel:'已上线',cat:'企业风控',desc:'企业查询、风险评分、关系图谱、招投标、尽调报告',apis:6,update:'实时',price:699,link:'package-enterprise-risk.html'},
  {name:'金融宏观数据',icon:'ti-chart-line',color:'ic-purple',status:'live',statusLabel:'热门',cat:'金融',desc:'CPI/GDP/利率、财报摘要、加密基础数据、宏观报告',apis:7,update:'每日',price:99,link:'package-finance-macro.html'},
  {name:'Web3 / Crypto',icon:'ti-currency-bitcoin',color:'ic-coral',status:'soon',statusLabel:'即将上线',cat:'Web3',desc:'DeFi TVL、交易所公告、新币上线、项目风险评分',apis:6,update:'实时',price:99,link:'package-web3-crypto.html'},
  {name:'政策与招投标',icon:'ti-file-text',color:'ic-teal',status:'soon',statusLabel:'规划中',cat:'政策',desc:'政策监控、招投标线索、补贴匹配、商机提醒',apis:5,update:'每日',price:199,link:'package-policy-bidding.html'},
  {name:'技术专利趋势',icon:'ti-microscope',color:'ic-gray',status:'soon',statusLabel:'规划中',cat:'科研',desc:'专利查询、论文趋势、技术路线、机构科研实力',apis:6,update:'每周',price:199,link:'package-patent-tech.html'},
  {name:'教育与选校',icon:'ti-school',color:'ic-pink',status:'soon',statusLabel:'规划中',cat:'教育',desc:'大学数据库、专业对比、科研实力、选校 AI 报告',apis:6,update:'每周',price:49,link:'package-education.html'}
];

var statusFilter='all';
var catFilter='all';

function render(list){
  var grid=document.getElementById('pkg-grid');
  var empty=document.getElementById('empty-state');
  if(list.length===0){
    grid.innerHTML='';
    empty.style.display='block';
    document.getElementById('result-count').textContent='0 个数据包';
    return;
  }
  empty.style.display='none';
  document.getElementById('result-count').textContent=list.length+' 个数据包';

  grid.innerHTML=list.map(function(p){
    var tagCls=p.status==='live'?(p.statusLabel==='热门'?'tag-hot':'tag-live'):'tag-soon';
    return '<div class="pkg-card" onclick="location.href=\''+p.link+'\'">'+
      '<div class="pkg-top">'+
        '<div class="pkg-icon '+p.color+'"><i class="ti '+p.icon+'" aria-hidden="true"></i></div>'+
        '<span class="pkg-tag '+tagCls+'">'+p.statusLabel+'</span>'+
      '</div>'+
      '<div class="pkg-name">'+p.name+'</div>'+
      '<div class="cat-pills"><span class="cat-pill">'+p.cat+'</span></div>'+
      '<div class="pkg-desc">'+p.desc+'</div>'+
      '<div class="pkg-foot">'+
        '<div class="pkg-foot-meta">'+
          '<span><i class="ti ti-api" style="font-size:13px" aria-hidden="true"></i>'+p.apis+' 接口</span>'+
          '<span><i class="ti ti-refresh" style="font-size:13px" aria-hidden="true"></i>'+p.update+'</span>'+
        '</div>'+
        '<div style="text-align:right"><div class="pkg-price-from">起</div><div class="pkg-price">¥'+p.price+'/月</div></div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function applyFilters(){
  var q=document.getElementById('search-input').value.trim().toLowerCase();
  var sort=document.getElementById('sort-select').value;

  var filtered=packages.filter(function(p){
    var statusOk=statusFilter==='all'||p.status===statusFilter;
    var catOk=catFilter==='all'||p.cat===catFilter;
    var searchOk=!q||p.name.toLowerCase().indexOf(q)>=0||p.desc.toLowerCase().indexOf(q)>=0||p.cat.toLowerCase().indexOf(q)>=0;
    return statusOk&&catOk&&searchOk;
  });

  if(sort==='price-asc'){
    filtered=filtered.slice().sort(function(a,b){return a.price-b.price});
  } else if(sort==='name'){
    filtered=filtered.slice().sort(function(a,b){return a.name.localeCompare(b.name,'zh')});
  }

  render(filtered);
}

document.querySelectorAll('#status-filters .filter-chip').forEach(function(chip){
  chip.addEventListener('click',function(){
    document.querySelectorAll('#status-filters .filter-chip').forEach(function(c){c.classList.remove('active')});
    chip.classList.add('active');
    statusFilter=chip.dataset.status;
    applyFilters();
  });
});

document.querySelectorAll('#cat-filters .filter-chip').forEach(function(chip){
  chip.addEventListener('click',function(){
    document.querySelectorAll('#cat-filters .filter-chip').forEach(function(c){c.classList.remove('active')});
    chip.classList.add('active');
    catFilter=chip.dataset.cat;
    applyFilters();
  });
});

render(packages);
</script>
</div>
</body>
</html>
