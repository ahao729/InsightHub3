<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 文档中心 · InsightHub Data</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="assets/stub-runtime.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<script>navigator.serviceWorker?.register("/service-worker.js")</script>
</head>
<body>
<div class="page-shell">
<style>
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 32px;border-bottom:0.5px solid var(--color-border-tertiary)}
.logo{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--color-brand)}
.search-box{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);width:240px}
.search-box input{border:none;outline:none;background:transparent;font-size:12px;color:var(--color-text-primary);width:100%}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 260px;min-height:680px}
.sidebar{border-right:0.5px solid var(--color-border-tertiary);padding:18px 0;overflow-y:auto}
.sb-group-title{font-size:11px;color:var(--color-text-secondary);font-weight:500;padding:10px 18px 6px;text-transform:uppercase;letter-spacing:0.04em}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 18px;font-size:12.5px;color:var(--color-text-secondary);cursor:pointer}
.sb-item:hover{background:var(--color-background-secondary)}
.sb-item.active{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500;border-right:2px solid var(--color-brand)}
.sb-method{font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;width:32px;text-align:center;flex-shrink:0}
.m-get{background:#E6F1FB;color:#185FA5}
.m-post{background:var(--color-brand-light);color:var(--color-brand-dark)}
.main{padding:28px 32px;overflow-y:auto;border-right:0.5px solid var(--color-border-tertiary)}
.endpoint-header{margin-bottom:20px}
.endpoint-path-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.endpoint-method{font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--border-radius-md)}
.endpoint-path{font-size:15px;font-family:var(--font-mono);font-weight:500}
.endpoint-title{font-size:18px;font-weight:500;margin-bottom:6px}
.endpoint-desc{font-size:13px;color:var(--color-text-secondary);line-height:1.7;margin-bottom:20px}
.section-label{font-size:12px;font-weight:500;color:var(--color-text-primary);margin:24px 0 10px;text-transform:uppercase;letter-spacing:0.03em}
.param-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px}
.param-table th{text-align:left;padding:8px 0;border-bottom:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);font-weight:500;font-size:11px}
.param-table td{padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:top}
.param-name{font-family:var(--font-mono);color:var(--color-text-primary);font-weight:500}
.param-required{color:#A32D2D;font-size:10px;margin-left:4px}
.param-type{font-family:var(--font-mono);color:#185FA5;font-size:11px}
.param-desc{color:var(--color-text-secondary)}
.field-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.field-table th{text-align:left;padding:8px 0;border-bottom:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);font-weight:500;font-size:11px}
.field-table td{padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.field-type{font-family:var(--font-mono);color:#185FA5;font-size:11px}
.error-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px}
.error-code{font-family:var(--font-mono);font-weight:500;width:50px;flex-shrink:0}
.error-code.ok{color:var(--color-brand-dark)}
.error-code.bad{color:#A32D2D}
.error-desc{color:var(--color-text-secondary)}
.right-panel{padding:18px 18px;background:var(--color-background-secondary)}
.req-box{background:#1e1e1e;border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:16px}
.req-tabs{display:flex;gap:2px;padding:8px 12px 0;background:#1e1e1e}
.req-tab{font-size:11px;padding:5px 10px;cursor:pointer;color:#9a9a9a;border-radius:4px 4px 0 0}
.req-tab.active{color:#fff;background:#2a2a2a}
.req-code{padding:14px;font-family:var(--font-mono);font-size:11.5px;line-height:1.7;color:#d4d4d4;overflow-x:auto;white-space:pre}
.code-k{color:#9cdcfe}
.code-s{color:#ce9178}
.code-c{color:#6a9955}
.code-f{color:#dcdcaa}
.resp-label{font-size:11px;color:var(--color-text-secondary);font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.resp-status{font-size:10px;padding:1px 7px;border-radius:999px;background:var(--color-brand-light);color:var(--color-text-success)}
.resp-box{background:#1e1e1e;border-radius:var(--border-radius-lg);padding:14px;font-family:var(--font-mono);font-size:11.5px;line-height:1.7;color:#d4d4d4;overflow-x:auto;white-space:pre}
.copy-btn{position:absolute;top:8px;right:8px;background:none;border:none;color:#9a9a9a;cursor:pointer;font-size:13px}
.rel-box{position:relative}
</style>

<div class="nav">
  <div class="logo" onclick="location.href='index.html'"><div class="logo-dot"></div>InsightHub Data API 文档</div>
  <div class="search-box"><i class="ti ti-search" style="font-size:13px" aria-hidden="true"></i><input type="text" placeholder="搜索接口..." /></div>
  <button class="hamburger" id="hamburger-btn" aria-label="导航菜单" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</div>

<div class="mobile-drawer" id="mobile-drawer">
  <a class="drawer-link" href="marketplace.html">数据产品</a>
  <a class="drawer-link" href="api-docs.html">API 文档</a>
  <a class="drawer-link" href="pricing.html">定价</a>
  <a class="drawer-link" href="solutions.html">解决方案</a>
  <a class="drawer-link" href="auth.html">登录 / 注册</a>
</div>
<div class="drawer-backdrop" id="drawer-backdrop"></div>

<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
  <div class="right-panel" id="right-panel"></div>
</div>

<script>
var endpoints=[
  {group:'快速开始',items:[
    {id:'auth',method:null,path:'认证方式',title:'API 认证',desc:'所有请求需在 Header 中携带 API Key 进行认证。'}
  ]},
  {group:'创业商业情报包',items:[
    {id:'industry-trends',method:'GET',path:'/v1/industry/trends',title:'查询行业趋势',desc:'根据行业关键词，返回该行业近年的增长趋势、市场规模与驱动因素。',
     params:[
       {name:'industry',required:true,type:'string',desc:'行业关键词，如「AI 客服 SaaS」'},
       {name:'region',required:false,type:'string',desc:'地区代码，默认 CN'},
       {name:'period',required:false,type:'string',desc:'时间范围，如 3y / 5y，默认 3y'}
     ],
     fields:[
       {name:'growth_rate',type:'number',desc:'年均增长率'},
       {name:'market_size',type:'string',desc:'市场规模估算'},
       {name:'trend_data',type:'array',desc:'历史趋势序列'}
     ],
     reqBody:'{\n  <span class="code-k">"industry"</span>: <span class="code-s">"AI 客服 SaaS"</span>,\n  <span class="code-k">"region"</span>: <span class="code-s">"CN"</span>\n}',
     respBody:'{\n  <span class="code-k">"growth_rate"</span>: <span class="code-f">0.34</span>,\n  <span class="code-k">"market_size"</span>: <span class="code-s">"约 120 亿元"</span>,\n  <span class="code-k">"trend_data"</span>: [<span class="code-f">82</span>, <span class="code-f">96</span>, <span class="code-f">118</span>],\n  <span class="code-k">"updated_at"</span>: <span class="code-s">"2025-07-14T10:00:00Z"</span>\n}'},
    {id:'project-evaluate',method:'POST',path:'/v1/project/evaluate',title:'创业项目评估',desc:'输入项目方向，返回市场机会评分、竞品概览与 MVP 建议。',
     params:[
       {name:'project_desc',required:true,type:'string',desc:'项目方向描述'},
       {name:'target_user',required:false,type:'string',desc:'目标用户画像'}
     ],
     fields:[
       {name:'opportunity_score',type:'integer',desc:'市场机会评分 0–100'},
       {name:'top_risk',type:'string',desc:'最大风险项'},
       {name:'mvp_suggestion',type:'string',desc:'MVP 建议'}
     ],
     reqBody:'{\n  <span class="code-k">"project_desc"</span>: <span class="code-s">"面向中小企业的 AI 客服 SaaS"</span>\n}',
     respBody:'{\n  <span class="code-k">"opportunity_score"</span>: <span class="code-f">82</span>,\n  <span class="code-k">"top_risk"</span>: <span class="code-s">"大厂自研替代风险"</span>,\n  <span class="code-k">"mvp_suggestion"</span>: <span class="code-s">"先做微信/企微接入"</span>\n}'},
    {id:'competitor-list',method:'GET',path:'/v1/competitor/list',title:'生成竞品列表',desc:'根据行业或产品关键词，返回主要竞品及其流量、定价信息。',
     params:[{name:'keyword',required:true,type:'string',desc:'产品或行业关键词'}],
     fields:[{name:'competitors',type:'array',desc:'竞品列表，含名称/流量/定价'}],
     reqBody:'{\n  <span class="code-k">"keyword"</span>: <span class="code-s">"AI 客服 SaaS"</span>\n}',
     respBody:'{\n  <span class="code-k">"competitors"</span>: [\n    { <span class="code-k">"name"</span>: <span class="code-s">"Intercom"</span>, <span class="code-k">"traffic"</span>: <span class="code-s">"120万/月"</span> }\n  ]\n}'}
  ]},
  {group:'AI / GEO 数据包',items:[
    {id:'geo-score',method:'POST',path:'/v1/geo/visibility-score',title:'网站 AI 可见度评分',desc:'输入网站 URL，返回 AI 搜索可见度综合评分及子项明细。',
     params:[{name:'url',required:true,type:'string',desc:'目标网站 URL'}],
     fields:[
       {name:'visibility_score',type:'integer',desc:'综合可见度评分 0–100'},
       {name:'content_gaps',type:'array',desc:'内容缺口建议'}
     ],
     reqBody:'{\n  <span class="code-k">"url"</span>: <span class="code-s">"https://example.com"</span>\n}',
     respBody:'{\n  <span class="code-k">"visibility_score"</span>: <span class="code-f">74</span>,\n  <span class="code-k">"content_gaps"</span>: [<span class="code-s">"缺少 FAQ 结构化数据"</span>]\n}'},
    {id:'geo-gap',method:'POST',path:'/v1/geo/competitor-gap',title:'竞品内容差距分析',desc:'对比目标网站与竞品网站的内容覆盖度，识别差距主题。',
     params:[{name:'url',required:true,type:'string',desc:'目标网站 URL'},{name:'competitor_url',required:true,type:'string',desc:'竞品网站 URL'}],
     fields:[{name:'gap_topics',type:'array',desc:'内容覆盖差距主题列表'}],
     reqBody:'{\n  <span class="code-k">"url"</span>: <span class="code-s">"https://example.com"</span>,\n  <span class="code-k">"competitor_url"</span>: <span class="code-s">"https://competitor.com"</span>\n}',
     respBody:'{\n  <span class="code-k">"gap_topics"</span>: [<span class="code-s">"产品对比页"</span>, <span class="code-s">"客户案例"</span>]\n}'}
  ]},
  {group:'企业情报与风控包',items:[
    {id:'company-lookup',method:'GET',path:'/v1/company/lookup',title:'企业基础信息查询',desc:'根据企业名称查询注册资本、成立时间、参保人数等基础信息。',
     params:[{name:'company_name',required:true,type:'string',desc:'企业全称'}],
     fields:[{name:'basic_info',type:'object',desc:'企业基础信息对象'}],
     reqBody:'{\n  <span class="code-k">"company_name"</span>: <span class="code-s">"某科技有限公司"</span>\n}',
     respBody:'{\n  <span class="code-k">"basic_info"</span>: {\n    <span class="code-k">"registered_capital"</span>: <span class="code-s">"1000万元"</span>,\n    <span class="code-k">"established_date"</span>: <span class="code-s">"2019-03-12"</span>\n  }\n}'},
    {id:'company-risk',method:'GET',path:'/v1/company/risk-score',title:'企业风险评分',desc:'返回企业综合风险评分及司法、经营异常记录摘要。',
     params:[{name:'company_name',required:true,type:'string',desc:'企业全称'}],
     fields:[{name:'risk_score',type:'integer',desc:'综合风险评分 0–100'},{name:'risk_level',type:'string',desc:'风险等级：低/中/高'}],
     reqBody:'{\n  <span class="code-k">"company_name"</span>: <span class="code-s">"某科技有限公司"</span>\n}',
     respBody:'{\n  <span class="code-k">"risk_score"</span>: <span class="code-f">12</span>,\n  <span class="code-k">"risk_level"</span>: <span class="code-s">"低"</span>\n}'}
  ]}
];

var current=endpoints[1].items[0];
var currentLang='curl';

var langSamples={
  curl:function(ep){
    return '<span class="code-f">curl</span> -X '+ep.method+' https://api.insighthub.data'+ep.path+' \\\n  -H <span class="code-s">"Authorization: Bearer YOUR_API_KEY"</span> \\\n  -H <span class="code-s">"Content-Type: application/json"</span>'+(ep.method==='POST'?' \\\n  -d \''+stripTags(ep.reqBody)+'\'':'');
  },
  python:function(ep){
    return '<span class="code-k">import</span> requests\n\nresp = requests.'+ep.method.toLowerCase()+'(\n  <span class="code-s">"https://api.insighthub.data'+ep.path+'"</span>,\n  headers={<span class="code-s">"Authorization"</span>: <span class="code-s">"Bearer YOUR_API_KEY"</span>}'+(ep.method==='POST'?',\n  json='+stripTags(ep.reqBody):'')+'\n)\n<span class="code-f">print</span>(resp.json())';
  },
  node:function(ep){
    return '<span class="code-k">const</span> resp = <span class="code-k">await</span> <span class="code-f">fetch</span>(<span class="code-s">"https://api.insighthub.data'+ep.path+'"</span>, {\n  method: <span class="code-s">"'+ep.method+'"</span>,\n  headers: { <span class="code-s">"Authorization"</span>: <span class="code-s">"Bearer YOUR_API_KEY"</span> }'+(ep.method==='POST'?',\n  body: JSON.stringify('+stripTags(ep.reqBody)+')':'')+'\n});\n<span class="code-k">const</span> data = <span class="code-k">await</span> resp.json();'
  }
};

function stripTags(s){return s.replace(/<[^>]*>/g,'')}

function renderSidebar(){
  var html='';
  endpoints.forEach(function(g){
    html+='<div class="sb-group-title">'+g.group+'</div>';
    g.items.forEach(function(it){
      var methodHtml=it.method?'<span class="sb-method m-'+it.method.toLowerCase()+'">'+it.method+'</span>':'<span class="sb-method" style="background:transparent"></span>';
      html+='<div class="sb-item'+(it.id===current.id?' active':'')+'" data-id="'+it.id+'" onclick="selectEndpoint(\''+it.id+'\')">'+methodHtml+'<span>'+it.title+'</span></div>';
    });
  });
  document.getElementById('sidebar').innerHTML=html;
}

function findEndpoint(id){
  for(var i=0;i<endpoints.length;i++){
    for(var j=0;j<endpoints[i].items.length;j++){
      if(endpoints[i].items[j].id===id) return endpoints[i].items[j];
    }
  }
}

function renderMain(){
  var ep=current;
  if(!ep.method){
    document.getElementById('main').innerHTML=
      '<div class="endpoint-title">'+ep.title+'</div>'+
      '<div class="endpoint-desc">'+ep.desc+'</div>'+
      '<div class="section-label">请求头</div>'+
      '<table class="param-table"><tr><th>Header</th><th>说明</th></tr>'+
      '<tr><td class="param-name">Authorization</td><td class="param-desc">格式为 Bearer YOUR_API_KEY，在工作台「API Keys」中获取</td></tr>'+
      '<tr><td class="param-name">Content-Type</td><td class="param-desc">application/json</td></tr></table>'+
      '<div class="section-label">通用错误码</div>'+
      '<div class="error-row"><span class="error-code ok">200</span><span class="error-desc">请求成功</span></div>'+
      '<div class="error-row"><span class="error-code bad">401</span><span class="error-desc">API Key 无效或缺失</span></div>'+
      '<div class="error-row"><span class="error-code bad">403</span><span class="error-desc">当前套餐不包含该数据包权限</span></div>'+
      '<div class="error-row"><span class="error-code bad">429</span><span class="error-desc">超出调用额度限制</span></div>'+
      '<div class="error-row"><span class="error-code bad">500</span><span class="error-desc">服务内部错误</span></div>';
    document.getElementById('right-panel').innerHTML='';
    return;
  }

  var paramHtml=ep.params.map(function(p){
    return '<tr><td><span class="param-name">'+p.name+'</span>'+(p.required?'<span class="param-required">必填</span>':'')+'</td><td class="param-type">'+p.type+'</td><td class="param-desc">'+p.desc+'</td></tr>';
  }).join('');

  var fieldHtml=ep.fields.map(function(f){
    return '<tr><td class="param-name">'+f.name+'</td><td class="field-type">'+f.type+'</td><td class="param-desc">'+f.desc+'</td></tr>';
  }).join('');

  document.getElementById('main').innerHTML=
    '<div class="endpoint-header">'+
      '<div class="endpoint-path-row"><span class="endpoint-method m-'+ep.method.toLowerCase()+'">'+ep.method+'</span><span class="endpoint-path">'+ep.path+'</span></div>'+
      '<div class="endpoint-title">'+ep.title+'</div>'+
      '<div class="endpoint-desc">'+ep.desc+'</div>'+
    '</div>'+
    '<div class="section-label">请求参数</div>'+
    '<table class="param-table"><tr><th>参数</th><th>类型</th><th>说明</th></tr>'+paramHtml+'</table>'+
    '<div class="section-label">返回字段</div>'+
    '<table class="field-table"><tr><th>字段</th><th>类型</th><th>说明</th></tr>'+fieldHtml+'</table>'+
    '<div class="section-label">错误码</div>'+
    '<div class="error-row"><span class="error-code ok">200</span><span class="error-desc">请求成功</span></div>'+
    '<div class="error-row"><span class="error-code bad">400</span><span class="error-desc">请求参数缺失或格式错误</span></div>'+
    '<div class="error-row"><span class="error-code bad">429</span><span class="error-desc">超出调用额度限制</span></div>';

  renderRightPanel();
}

function renderRightPanel(){
  var ep=current;
  var langs=['curl','python','node'];
  var langLabels={curl:'cURL',python:'Python',node:'Node.js'};
  var tabsHtml=langs.map(function(l){
    return '<div class="req-tab'+(l===currentLang?' active':'')+'" onclick="selectLang(\''+l+'\')">'+langLabels[l]+'</div>';
  }).join('');

  document.getElementById('right-panel').innerHTML=
    '<div class="req-box">'+
      '<div class="req-tabs">'+tabsHtml+'</div>'+
      '<div class="rel-box"><button class="copy-btn" aria-label="复制代码" onclick="copyCode(\'req-code\')"><i class="ti ti-copy" aria-hidden="true"></i></button><div class="req-code" id="req-code">'+langSamples[currentLang](ep)+'</div></div>'+
    '</div>'+
    '<div class="resp-label">响应示例 <span class="resp-status">200 OK</span></div>'+
    '<div class="rel-box"><button class="copy-btn" aria-label="复制响应" onclick="copyCode(\'resp-code\')"><i class="ti ti-copy" aria-hidden="true"></i></button><div class="resp-box" id="resp-code">'+ep.respBody+'</div></div>';
}

function selectEndpoint(id){
  current=findEndpoint(id);
  renderSidebar();
  renderMain();
}

function selectLang(l){
  currentLang=l;
  renderRightPanel();
}

function copyCode(id){
  var el=document.getElementById(id);
  if(!el)return;
  var text=el.innerText;
  if(navigator.clipboard) navigator.clipboard.writeText(text);
}

renderSidebar();
renderMain();
</script>
</div>
</body>
</html>
