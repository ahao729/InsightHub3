  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <!-- Robot head -->
  <rect x="500" y="150" width="200" height="160" rx="30" fill="#fff" stroke="#0E6245" stroke-width="1.5" stroke-opacity="0.2"/>
