# InsightHub Backend — Render Infrastructure as Code
# https://render.com/docs/infrastructure-as-code
#
# 部署步骤:
# 1. Fork/push 代码到 GitHub
# 2. 在 Render Dashboard 创建 Blueprint，连接仓库
# 3. Render 会自动读取此文件并创建服务
# 4. 手动设置敏感环境变量（见下方说明）

services:
  # ── Backend API (Express) ─────────────────────────────────────────
  - type: web
    name: insighthub-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      # ── Node ──
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      # ── Database（由下方 databases 部分自动注入）──
      - key: DATABASE_URL
        fromDatabase:
          name: insighthub-db
          property: connectionString

      # ── JWT（在 Render Dashboard 中手动设置）──
      - key: JWT_SECRET
        generateValue: true

      # ── CORS（实际前端域名）──
      - key: CORS_ORIGINS
        value: "https://insight-hub3.vercel.app"

      # ── LLM Provider（在 Render Dashboard 中手动设置）──
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: "https://api.deepseek.com/v1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ZHIPU_API_KEY
        sync: false

      # ── 模型路由 ──
      - key: FAST_MODEL
        value: gpt-4o-mini
      - key: ANALYSIS_MODEL
        value: gpt-4o
      - key: REASONING_MODEL
        value: deepseek-chat
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"

      # ── Token 限速 ──
      - key: TOKEN_TRACKING_ENABLED
        value: "true"
      - key: DAILY_TOKEN_LIMIT
        value: "1000000"
      - key: USER_DAILY_TOKEN_LIMIT
        value: "100000"

      # ── 管理员（部署后建议在 Dashboard 修改为自定义值）──
      - key: ADMIN_INVITE_CODE
        value: "INSIGHTHUB2024"
      - key: ADMIN_DEFAULT_PASSWORD
        value: "Admin@InsightHub2024"

      # ── LLM Mock Mode（生产环境留空）──
      - key: LLM_MOCK_MODE
        value: ""

      # ── SMTP（可选，在 Render Dashboard 中手动设置）──
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "InsightHub <no-reply@insighthub.data>"
      - key: FRONTEND_URL
        value: "https://insight-hub3.vercel.app"

      # ── OAuth（Google / GitHub）──
      # 在 Google Cloud Console 和 GitHub Developer Settings 中创建应用后填入
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: BACKEND_URL
        value: "https://insighthub-backend.onrender.com"

      # ── Langfuse 可观测性（可选）──
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false

# ── PostgreSQL 数据库 ───────────────────────────────────────────────
databases:
  - name: insighthub-db
    plan: free
    databaseName: insighthub
    ipAllowList: []
