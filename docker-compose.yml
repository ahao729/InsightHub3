# InsightHub — 生产部署编排
# 启动: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f

services:
  # ── PostgreSQL 数据库 ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: insighthub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: insighthub
      POSTGRES_USER: insighthub
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insighthub -d insighthub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - insighthub-net

  # ── Backend API (Express) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insighthub-api
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://insighthub:${DB_PASSWORD}@db:5432/insighthub
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80}
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE:-}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}

      # ── LLM Mock Mode (强制 mock，适合无额度的开发环境) ──
      LLM_MOCK_MODE: ${LLM_MOCK_MODE:-}

      # ── LLM Provider ──
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_BASE_URL: ${ZHIPU_BASE_URL:-}

      # ── 模型路由 ──
      FAST_MODEL: ${FAST_MODEL:-gpt-4o-mini}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-gpt-4o}
      REASONING_MODEL: ${REASONING_MODEL:-deepseek-chat}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}

      # ── 可观测性 ──
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}

      # ── Token 限速 ──
      TOKEN_TRACKING_ENABLED: ${TOKEN_TRACKING_ENABLED:-true}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-1000000}
      USER_DAILY_TOKEN_LIMIT: ${USER_DAILY_TOKEN_LIMIT:-100000}

      # ── 其他 ──
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - insighthub-net

  # ── Frontend (nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insighthub-web
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - insighthub-net

  # ── Crawler (按需/定时运行) ──────────────────────────────────────
  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: insighthub-crawler
    restart: "no"
    profiles:
      - crawler      # 仅在 docker compose --profile crawler up 时启动
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://insighthub:${DB_PASSWORD}@db:5432/insighthub
      SCRAPY_SETTINGS_MODULE: crawler.settings
    networks:
      - insighthub-net

volumes:
  pgdata:
    driver: local

networks:
  insighthub-net:
    driver: bridge
